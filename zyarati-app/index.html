<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E5E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-192.png">
<title>زياراتي</title>
<style>
:root{
  color-scheme:light;
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#15201C; --muted:#5B6964; --line:#D5DDD9;
  --accent:#0B6E5E; --accent-ink:#FFFFFF; --accent-soft:#DCEEE9;
  --warn:#9A5B00; --warn-bg:#FFF2D6; --warn-line:#EBC67A;
  --info:#2B5DA8; --info-bg:#E4ECFA;
  --done:#3F8F4E; --done-bg:#E3F2E5;
  --shadow:0 1px 2px rgba(16,32,28,.06),0 4px 14px rgba(16,32,28,.05);
  --sans:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  --mono:ui-monospace,"Roboto Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0E1412; --surface:#17201D; --ink:#E4ECE8; --muted:#94A39D; --line:#2A3632;
    --accent:#38B39C; --accent-ink:#06120F; --accent-soft:#16332D;
    --warn:#F2BE5C; --warn-bg:#2E2412; --warn-line:#5E4718;
    --info:#8DB2F0; --info-bg:#172338;
    --done:#7FCB8C; --done-bg:#15291A;
    --shadow:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header{display:flex;align-items:flex-start;gap:10px}
header .t{flex:1}
h1{font-size:22px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;color:var(--muted)}
.stat b{color:var(--ink);font-size:16px;margin-inline-end:6px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--done);transition:width .25s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--sans);padding:9px 14px;text-decoration:none;cursor:pointer;min-height:42px}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;font-size:16px;min-height:50px}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}
.routes{display:flex;flex-direction:column;gap:8px}
.alerts{background:var(--surface);border:1px solid var(--warn-line);border-radius:14px;padding:12px 14px}
.alerts h2{font-size:15px;margin:0 0 8px;color:var(--warn)}
.alerts ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.alerts li{font-size:14px;display:flex;gap:8px;align-items:baseline}
.alerts li::before{content:"";flex:none;width:7px;height:7px;border-radius:2px;background:var(--warn);transform:translateY(-2px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.bar .grp{display:flex;gap:6px;flex-wrap:wrap}
#list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.done{background:var(--done-bg);border-color:transparent;box-shadow:none}
.card.done .body{display:none}
.hide-done .card.done{display:none}
.head{display:flex;align-items:center;gap:10px}
.seq{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font:600 14px var(--mono)}
.card.done .seq{background:var(--done)}
.sid{font:600 21px var(--mono)}
.head .sp{flex:1}
.toggle{border-radius:99px}
.card.done .toggle{background:var(--done);border-color:var(--done);color:var(--surface)}
.body{display:flex;flex-direction:column;gap:10px}
.task{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:14px;font-weight:600}
.task span{color:var(--accent);font-weight:700;margin-inline-end:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:500;border-radius:6px;padding:3px 8px;background:var(--info-bg);color:var(--info)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.coords{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.coords .num{color:var(--ink);font-size:14px}
.nocoord{background:var(--warn-bg);border:1px dashed var(--warn-line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.nocoord strong{color:var(--warn);font-size:15px}
.nocoord dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.nocoord dt{color:var(--muted)}
.nocoord dd{margin:0}
.addr{font-size:13px;color:var(--muted)}
.phones{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:9px 0;border-bottom:1px solid var(--line)}
.ph:last-child{border-bottom:0}
.ph .num{font-size:16px;user-select:all}
.ph .cnt{font-size:12px;color:var(--muted)}
.ph .tag{font-size:11.5px;color:var(--info);background:var(--info-bg);border-radius:5px;padding:1px 6px}
.ph.main .num{font-weight:700}
.ph .acts{display:flex;gap:6px;margin-inline-start:auto}
.btn.call{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{color:var(--accent)}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted)}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--sans);padding:9px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.res{font-size:13px;color:var(--done);font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.sheet h3{margin:0;font-size:17px}
.lbl{font-size:13px;color:var(--muted);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 14px var(--sans);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:start}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tpls{display:flex;flex-direction:column;gap:6px}
.tpls .opt{width:100%;font-size:13.5px}
textarea{width:100%;min-height:70px;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px;font:15px var(--sans);background:var(--bg);color:var(--ink);resize:vertical}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.btn.danger{color:#B3261E}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.doc.logged{opacity:.55;box-shadow:none}
.doc .full{font:700 22px var(--mono);letter-spacing:.03em}
.doc .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.doc .work{background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-weight:700}
.doc .note{flex:1;min-width:200px;font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px}
.doc .meta{font-size:12px;color:var(--muted)}
.dhead{font-size:13px;color:var(--muted);font-weight:700;margin-top:4px}
.chk{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px}
.chk .q{font-size:14px;font-weight:600}
.chk .q.sub2{font-weight:500;color:var(--muted);padding-inline-start:14px}
.yn{display:flex;gap:6px}
.yn .opt{min-width:52px;text-align:center;padding:7px 10px;background:var(--surface)}
.yn .opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.yn .opt[aria-pressed="true"][data-v="no"]{background:#B3261E;border-color:#B3261E;color:#fff}
.yn .opt:disabled{opacity:.35}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;inset-inline-end:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font:700 14px var(--sans);cursor:pointer}
.thumb .tag0{position:absolute;bottom:0;inset-inline:0;background:rgba(11,110,94,.85);color:#fff;font-size:10.5px;text-align:center;padding:1px 0}
.checks{font-size:13px;color:var(--ink);background:var(--bg);border-radius:8px;padding:6px 10px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:15px var(--sans);background:var(--bg);color:var(--ink)}
.sync{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--warn-bg);color:var(--warn)}
.sync.ok{background:var(--done-bg);color:var(--done)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.fullrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.fullrow .num{font-size:15px;font-weight:600}
.fullrow .tag{font-size:11px;color:var(--warn);background:var(--warn-bg);border-radius:5px;padding:1px 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="t">
      <h1>زياراتي</h1>
      <p class="sub" id="sub">—</p>
    </div>
    <button class="btn sm" id="setBtn" type="button" aria-label="الإعدادات">⚙️</button>
    <button class="btn sm" id="importBtn" type="button">استيراد ملف</button>
    <input type="file" id="fileIn" accept=".json,application/json,text/plain" hidden>
    <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
    <input type="file" id="galIn" accept="image/*" multiple hidden>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabV" aria-selected="true">الزيارات</button>
    <button type="button" role="tab" id="tabD" aria-selected="false">التوثيق</button>
  </div>
  <div id="main"></div>
  <p class="foot">الإحداثيات: الأكثر تكراراً، وعند التعادل الأقدم · التلفونات من الأكثر تكراراً</p>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt="صورة الزيارة"></div>
<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
const STORE = "visits.data.v1", RES = "visits.results.v1", HIDE = "visits.hide.v1", SHOWLOG = "visits.showlogged.v1";
const WORKS = ["معالجة اتصال","تركيب مودم","جلب قراءة","توزيع فواتير"];
const NOTES = ["تم برمجة العداد مرتبط بالزمن ومعالجة الاتصال","تم برمجة العداد مرتبط بالزمن ويوجد ضعف شبكة","تم برمجة العداد مرتبط بالزمن , تم اجراء اللازم ولم يتصل","تم برمجة العداد مرتبط بالزمن و وجد العداد متصل","وجد العداد مبدل ومتصل , تم برمجة العداد مرتبط بالزمن عن بعد","وجد العداد مبدل ومتصل , تم برمجة العداد مرتبط بالزمن"];
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

let data = get(STORE, null);
// ---------- photo storage (IndexedDB) ----------
const IDB = (() => {
  let dbp;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("visits-photos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("p");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => db().then(d => new Promise((res, rej) => {
    const t = d.transaction("p", mode), req = fn(t.objectStore("p"));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
  }));
  return { put: (k, v) => run("readwrite", s => s.put(v, k)), get: k => run("readonly", s => s.get(k)), del: k => run("readwrite", s => s.delete(k)) };
})();
async function compress(file, max = 1280, q = 0.72){
  let bmp; try { bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); } catch(e) { bmp = await createImageBitmap(file); }
  const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
  return {blob, w:c.width, h:c.height};
}
const urlCache = {};
async function photoUrl(k){ if (urlCache[k]) return urlCache[k]; const v = await IDB.get(k).catch(()=>null); return v ? (urlCache[k] = URL.createObjectURL(v.blob)) : ""; }
async function fillThumbs(root){ for (const img of root.querySelectorAll("img[data-pk]")) img.src = await photoUrl(img.dataset.pk); }
function viewPhoto(src){ $("#viewerImg").src = src; $("#viewer").hidden = false; }
$("#viewer").onclick = () => { $("#viewer").hidden = true; };
const YN = {yes:"نعم", no:"لا"};
function checksText(c){
  if (!c) return "";
  const seal = (name, has, ok) => has === "no" ? `${name}: غير موجود` : has === "yes" ? `${name}: موجود${ok==="yes"?" وسليم":ok==="no"?" وغير سليم":""}` : "";
  return [seal("ختم المودم", c.modemSeal, c.modemOk), seal("ختم الكونيكشن", c.connSeal, c.connOk), c.weak ? `ضعف شبكة: ${YN[c.weak]}` : ""].filter(Boolean).join(" · ");
}

// ---------- settings + sync to Google Sheet ----------
const CFG = "visits.cfg.v1", DELQ = "visits.delq.v1";
let cfg = Object.assign({name:"", url:"", token:"", auto:true, team:[]}, get(CFG, {}));
const cfgReady = () => !!(cfg.url && cfg.token && cfg.name);
const sealTxt = (has, ok) => has === "no" ? "غير موجود" : has === "yes" ? (ok === "yes" ? "موجود وسليم" : ok === "no" ? "موجود وغير سليم" : "موجود") : "";
const b64url = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64url = s => decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))));
const blobToB64 = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(b); });
async function postScript(body){
  const res = await fetch(cfg.url, {method:"POST", body: JSON.stringify(body)});
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "فشل");
  return j;
}
async function payloadFor(r){
  const c = r.checks || {}, st = r.stop || {}, sent = r.sentPhotos || [], photos = [];
  for (const pk of (r.photos || [])){
    const item = {k: pk};
    if (!sent.includes(pk)){ const v = await IDB.get(pk).catch(()=>null); if (v) item.b64 = await blobToB64(v.blob); }
    photos.push(item);
  }
  const hasLoc = st.lat != null && st.lng != null;
  return {token:cfg.token, tech:r.tech || cfg.name, date:r.date, id:r.id, full:resFull(r), work:r.work, note:r.note,
    modem:sealTxt(c.modemSeal, c.modemOk), conn:sealTxt(c.connSeal, c.connOk), weak:c.weak ? YN[c.weak] : "",
    task:st.task || "", phone:st.phone || "", coords: hasLoc ? `${st.lat}, ${st.lng}` : "لا يوجد",
    map: hasLoc ? `https://www.google.com/maps?q=${st.lat},${st.lng}` : "",
    doneAt: new Date(r.at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}), photos};
}
function queueDelete(r){
  if (!r || !r.sent) return;
  const q = get(DELQ, []); q.push({deleted:true, tech:r.tech || cfg.name, date:r.date, id:r.id}); put(DELQ, q);
}
let syncing = false, syncAgain = false;
async function syncAll(manual){
  if (!cfgReady()){ if (manual) { toast("اضبط الإعدادات أول ⚙️"); openSettings(); } return; }
  if ((!manual && !cfg.auto) || (!navigator.onLine && !manual)) return;
  if (syncing){ syncAgain = true; return; }
  syncing = true; let ok = 0, fail = 0;
  try {
    const q = get(DELQ, []);
    while (q.length){ try { await postScript({...q[0], token:cfg.token}); q.shift(); put(DELQ, q); } catch(e){ fail++; break; } }
    for (const k of Object.keys(results)){
      const r = results[k]; if (!r || r.sent) continue;
      const v = r.v || 0;
      try {
        const body = await payloadFor(r); await postScript(body);
        const cur = results[k];
        if (cur && (cur.v || 0) === v){ cur.sent = true; cur.tech = body.tech; cur.sentPhotos = body.photos.map(x => x.k); }
        ok++;
      } catch(e){ fail++; if (manual && fail === 1) toast("ما انبعت: " + e.message); }
    }
  } finally { syncing = false; }
  put(RES, results);
  if (syncAgain){ syncAgain = false; setTimeout(() => syncAll(manual), 50); }
  if (ok || fail) render();
  if (fail) toast(`ما انبعت ${fail} — رح أعيد المحاولة لما يرجع النت`);
  else if (ok) toast(`☁️ انبعت ${ok} للمدير`);
  else if (manual) toast("كل الزيارات عند المدير ✓");
}
window.addEventListener("online", () => syncAll());

// ---------- install helpers ----------
let deferredInstall = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; const b = $("#instBox"); if (b) b.innerHTML = installBlock(); wireInstall(); });
window.addEventListener("appinstalled", () => { deferredInstall = null; const b = $("#instBox"); if (b) b.innerHTML = installBlock(); toast("انثبّت التطبيق ✅"); });
function installBlock(){
  if (isStandalone()) return `<div class="checks">✅ التطبيق مثبّت على شاشتك</div>`;
  if (deferredInstall) return `<button type="button" class="btn big" id="instBtn">📲 تثبيت التطبيق على الشاشة</button>`;
  if (isIOS) return `<div class="checks">على الآيفون: خليك على <b>Safari</b> وافتح الروابط منه مباشرة، وما في داعي تثبّته.</div>`;

const AR_DIG = s => String(s || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));

const todayStr = () => { const d = new Date(); return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear(); };
function parseCoords(t){
  const m = AR_DIG(t).replace(/٫/g,".").match(/(-?\d{1,2}\.\d{3,})\s*[,،\s]\s*(-?\d{1,3}\.\d{3,})/);
  return m ? {lat:+(+m[1]).toFixed(6), lng:+(+m[2]).toFixed(6)} : null;
}
const parsePhones = t => (AR_DIG(t).match(/(?:\+?962|0)?7[789]\d{7}/g) || []).map(x => "0" + x.replace(/^\+?962|^0/, "")).filter((x,i,a) => a.indexOf(x) === i);

function guessWork(task){ task = task || "";
  if (/اتصال|برمجة/.test(task)) return WORKS[0];
  if (/مودم/.test(task)) return WORKS[1];

function dist(a, b){
  const R = 6371000, t = Math.PI/180;
  const dLat = (b.lat-a.lat)*t, dLng = (b.lng-a.lng)*t;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// ---------- load data from link (#d=...) ----------
async function fromHash(h){
  const own = h === undefined; h = own ? location.hash : h;
  const cm = h.match(/^#cfg=([A-Za-z0-9_-]+)/);
  if (cm){
    try { const c = JSON.parse(unb64url(cm[1]));
      if (c.url) cfg.url = c.url; if (c.token) cfg.token = c.token; if (Array.isArray(c.team) && c.team.length) cfg.team = c.team;
      put(CFG, cfg); setTimeout(openWelcome, 300); }
    catch(e){ toast("رابط الانضمام ناقص أو تالف"); }
    if (own) history.replaceState(null, "", location.pathname);
    return true;
  }
  const m = h.match(/^#d=([A-Za-z0-9_-]+)/);
  if (!m) return false;
  try {
    const b64 = m[1].replace(/-/g,"+").replace(/_/g,"/");
    const bin = Uint8Array.from(atob(b64 + "===".slice((b64.length+3)%4)), c => c.charCodeAt(0));
    const txt = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    setData(JSON.parse(txt));
    toast("تم تحميل زيارات " + (data.date || "اليوم"));
  } catch(e) { toast("الرابط ناقص أو تالف — اطلب رابط جديد"); }
  if (own) history.replaceState(null, "", location.pathname);
  return true;
}
function setData(d){
  if (!d || !Array.isArray(d.stops)) throw new Error("bad");
  const key = d.date + "|" + d.stops.map(s=>s.id).join(",");
  if (data && data.date === d.date){
    const ids = new Set(d.stops.map(s => s.id));
    data.stops.filter(s => s.manual && !ids.has(s.id)).forEach(s => d.stops.push(s));
  }
  data = d; put(STORE, d);
}

// ---------- ordering from current location ----------
function orderFrom(start){
  const withC = data.stops.filter(hasC), noC = data.stops.filter(s => !hasC(s));
  const out = []; let cur = start; const left = withC.slice();
  while (left.length){
    let bi = 0, bd = Infinity;
    left.forEach((s,i) => { const d = dist(cur, s); if (d < bd) { bd = d; bi = i; } });
    cur = left.splice(bi,1)[0]; out.push(cur);
  }
  // put stops without coordinates right after a stop sharing a phone, else at the end
  noC.forEach(s => {
    const ph = new Set(s.phones.map(p=>p[0]));
    let at = -1; out.forEach((o,i) => { if (o.phones.some(p=>ph.has(p[0]))) at = i; });
    if (at >= 0) out.splice(at+1, 0, s); else out.push(s);
  });
  data.stops = out; put(STORE, data); render();
}
function sortByLocation(){
  if (!navigator.geolocation) return toast("الموقع غير متاح على هذا الجهاز");
  toast("جاري تحديد موقعك…");
  navigator.geolocation.getCurrentPosition(
    p => { orderFrom({lat:p.coords.latitude, lng:p.coords.longitude}); toast("رتبت المسار من موقعك"); },
    () => toast("ما قدرت أحدد موقعك — فعّل الـ GPS"),
    {enableHighAccuracy:true, timeout:15000}
  );
}

function alerts(){
  const S = data.stops, out = [], seen = new Set();
  const c = S.filter(hasC);
  for (let i=0;i<c.length;i++) for (let j=i+1;j<c.length;j++){
    const d = dist(c[i], c[j]);
    if (d <= 30) out.push(`نفس النقطة: <span class="num">${c[i].id}</span> + <span class="num">${c[j].id}</span> (~${Math.max(10,Math.round(d/10)*10)}م)`);
  }
  const phones = {};
  S.forEach(s => s.phones.forEach(([p]) => (phones[p] ||= new Set()).add(s.id)));
  Object.entries(phones).forEach(([p, ids]) => { if (ids.size > 1) out.push(`الرقم <span class="num">${p}</span> لـ ${ids.size} مشتركين: ${[...ids].map(x=>`<span class="num">${x}</span>`).join(" + ")} ← مكالمة وحدة`); });
  const hods = {};
  S.forEach(s => { if (s.land && s.land.hod) (hods[s.land.hod] ||= []).push(s); });
  Object.entries(hods).forEach(([h, arr]) => { if (arr.length > 1) out.push(`حوض ${esc(h)}: ` + arr.map(s=>`قطعة ${esc(s.land.qeta)} (<span class="num">${s.id}</span>)`).join(" · ")); });
  S.forEach(s => (s.warn||[]).forEach(w => out.push(`<span class="num">${s.id}</span>: ${esc(w)}`)));
  return out;
}
function sharedMap(){
  const m = {};
  data.stops.forEach(s => s.phones.forEach(([p]) => (m[p] ||= new Set()).add(s.id)));
  return m;
}
function routeLinks(){
  const pts = [];
  data.stops.filter(hasC).filter(s => !done[s.id]).forEach(s => { if (!pts.some(p => dist(p,s) < 25)) pts.push(s); });
  const links = [];
  for (let i=0; i<pts.length; i+=10){
    const chunk = pts.slice(i, i+10), dest = chunk[chunk.length-1];
    const wp = chunk.slice(0,-1).map(p=>`${p.lat},${p.lng}`).join("|");
    links.push({from:i+1, to:i+chunk.length, url:`https://www.google.com/maps/dir/?api=1&destination=${dest.lat},${dest.lng}${wp?`&waypoints=${encodeURIComponent(wp)}`:""}&travelmode=driving`});
  }
  return links;
}

        <button class="btn sm" id="resetBtn" type="button">تصفير</button></span>
      </div>
      <div id="list">${cards}</div>
    </div>`;
  $("#app").classList.toggle("hide-done", get(HIDE,false));
  $("#hideDone").onchange = e => { put(HIDE, e.target.checked); $("#app").classList.toggle("hide-done", e.target.checked); };
  $("#locBtn").onclick = sortByLocation;
  $("#addBtn").onclick = () => openSheet(null, true);
  fillThumbs(main).then(() => main.querySelectorAll(".card img[data-pk]").forEach(im => im.onclick = () => viewPhoto(im.src)));
  $("#exportBtn").onclick = exportExcel;
  $("#resetBtn").onclick = () => { S.forEach(s => { const r = results[rkey(s.id)]; if (r && !r.logged){ (r.photos||[]).forEach(pk => IDB.del(pk).catch(()=>{})); queueDelete(r); delete results[rkey(s.id)]; } }); syncAll(); put(RES, results); render(); toast("تم تصفير زيارات اليوم"); };
}

// ---------- result sheet ----------
function openSheet(id, isNew){
  const s = isNew ? {id:"", manual:true, phones:[]} : (data && data.stops.find(x => x.id === id)); if (!s) return;
  let key = isNew ? "" : rkey(id); const old = isNew ? null : results[key];
  let work = old ? old.work : guessWork(s.task);
  const chk = Object.assign({modemSeal:"", modemOk:"", connSeal:"", connOk:"", weak:""}, old && old.checks);
  let photos = (old && old.photos ? old.photos.slice() : []);   // existing keys
  const added = [], removed = [];
  const sh = $("#sheet");
  const yn = (f, dis) => `<span class="yn">${["yes","no"].map(v=>`<button type="button" class="opt" data-f="${f}" data-v="${v}" aria-pressed="${chk[f]===v}" ${dis?"disabled":""}>${YN[v]}</button>`).join("")}</span>`;
  const drawChecks = () => {
    $("#chkBox").innerHTML = `
      <span class="q">هل ختم المودم موجود؟</span>${yn("modemSeal")}
      <span class="q sub2">هل وجد سليم؟</span>${yn("modemOk", chk.modemSeal!=="yes")}
      <span class="q">هل ختم الكونيكشن موجود؟</span>${yn("connSeal")}
      <span class="q sub2">هل وجد سليم؟</span>${yn("connOk", chk.connSeal!=="yes")}
      <span class="q">هل يوجد ضعف شبكة؟</span>${yn("weak")}`;
    $("#chkBox").querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
      const f = b.dataset.f; chk[f] = chk[f] === b.dataset.v ? "" : b.dataset.v;
      if (f === "modemSeal" && chk.modemSeal !== "yes") chk.modemOk = "";
      if (f === "connSeal" && chk.connSeal !== "yes") chk.connOk = "";
      drawChecks();
    });
  };
  const drawPhotos = async () => {
    const all = [...photos.map(k => ({k})), ...added.map((a,i) => ({a, i}))];
    $("#phBox").innerHTML = all.map((x,n) => `<div class="thumb"><img alt="" ${x.k?`data-pk="${x.k}"`:`data-new="${x.i}"`}>
      <button type="button" class="x" ${x.k?`data-rk="${x.k}"`:`data-rn="${x.i}"`} aria-label="حذف الصورة">×</button>${n===0?`<span class="tag0">العداد</span>`:""}</div>`).join("")
      || `<span class="sub" style="margin:0">ما في صور</span>`;
    $("#phBox").querySelectorAll("img[data-new]").forEach(im => im.src = added[+im.dataset.new].url);
    await fillThumbs($("#phBox"));
    $("#phBox").querySelectorAll("img").forEach(im => im.onclick = () => viewPhoto(im.src));
    $("#phBox").querySelectorAll("[data-rk]").forEach(b => b.onclick = () => { removed.push(b.dataset.rk); photos = photos.filter(k => k !== b.dataset.rk); drawPhotos(); });
    $("#phBox").querySelectorAll("[data-rn]").forEach(b => b.onclick = () => { added.splice(+b.dataset.rn, 1); drawPhotos(); });
  };
  const onFiles = async files => {
    for (const f of files){ try { const c = await compress(f); added.push({...c, url: URL.createObjectURL(c.blob)}); } catch(e){ toast("ما قدرت أقرأ الصورة"); } }
    drawPhotos();
  };
  sh.innerHTML = `<h3>${isNew ? "➕ توثيق زيارة" : `نتيجة الزيارة · <span class="num">${esc(id)}</span>`}</h3>
    ${s.task?`<div class="task"><span>الطلب:</span>${esc(s.task)}</div>`:""}
    <label class="lbl" for="fullIn">رقم الاشتراك (10 خانات)</label>
    <input class="inp num" id="fullIn" inputmode="numeric" maxlength="10" dir="ltr" placeholder="0010132777" value="${isNew ? "" : esc((old && old.full) || stopFull(s))}">
    <p class="hint">أول 3 خانات رقم البلدة (اربد 001، جرش 004…). تأكد منه قبل الحفظ.</p>
    <div class="lbl">المهمة *</div>
    <div class="opts" id="works">${WORKS.map(w=>`<button type="button" class="opt" data-w="${w}" aria-pressed="${w===work}">${w}</button>`).join("")}</div>
    <div class="lbl">الفحص</div>
    <div class="chk" id="chkBox"></div>
    <div class="lbl">الصور (أول صورة = صورة العداد)</div>
    <div class="photos" id="phBox"></div>
    <div class="row"><button type="button" class="btn" id="camBtn">📷 كاميرا</button><button type="button" class="btn" id="galBtn">🖼️ من المعرض</button></div>
    <label class="lbl" for="noteIn">الملاحظة *</label>
    <textarea id="noteIn" placeholder="اكتب الإجراء الفعلي اللي تم عند المشترك">${esc(old ? old.note : "")}</textarea>
    <div class="row"><button type="button" class="btn primary" id="saveRes">حفظ وتم</button><button type="button" class="btn" id="closeSh">إلغاء</button></div>
    ${old?`<button type="button" class="btn danger" id="undoRes">${s.manual ? "حذف الزيارة" : old.logged ? "حذف النتيجة (موثّقة)" : "إلغاء تم"}</button>`:""}`;
  $("#sheetBg").hidden = false; sh.scrollTop = 0;
  drawChecks(); drawPhotos();
  if (isNew) setTimeout(() => $("#fullIn").focus(), 250);
  sh.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { work = b.dataset.w; sh.querySelectorAll("[data-w]").forEach(x => x.setAttribute("aria-pressed", x===b)); });
  $("#camBtn").onclick = () => { $("#camIn").value = ""; $("#camIn").onchange = e => onFiles(e.target.files); $("#camIn").click(); };
  $("#galBtn").onclick = () => { $("#galIn").value = ""; $("#galIn").onchange = e => onFiles(e.target.files); $("#galIn").click(); };
  $("#closeSh").onclick = closeSheet;
  $("#saveRes").onclick = async () => {
    const note = $("#noteIn").value.trim();
    const full = clean10($("#fullIn").value);
    if (full.length !== 10) return toast("رقم الاشتراك لازم يكون 10 خانات");
    const newId = String(parseInt(full.slice(3), 10));
    if (!+newId) return toast("رقم المشترك غلط");
    if (!s.manual && newId !== String(parseInt(clean10(id), 10))) return toast("آخر 7 خانات لازم تطابق رقم المشترك " + id);
    if (!work) return toast("اختار المهمة");
    if (!note) return toast("اكتب الملاحظة");
    const sameDay = data && data.date === todayStr();
    if (s.manual && newId !== s.id && data && (isNew ? sameDay : true) && data.stops.some(x => x.id === newId && x !== s))
      return toast("المشترك " + newId + " موجود بالقائمة — افتحه من بطاقته");
    if (isNew && !sameDay) data = {date: todayStr(), area:"", town: String(parseInt(full.slice(0,3),10)), stops: []};
    if (!isNew && s.manual && newId !== s.id && old){ queueDelete(old); delete results[key]; }
    if (s.manual) s.id = newId;
    if (isNew) data.stops.push(s);
    key = rkey(s.id);
    try {
      for (const k of removed) await IDB.del(k);
      for (const a of added){ const k = key + "|" + Date.now() + Math.random().toString(36).slice(2,6); await IDB.put(k, {blob:a.blob, w:a.w, h:a.h}); photos.push(k); }
      if (added.length && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
    } catch(e){ toast("مشكلة بحفظ الصور — جرّب مرة ثانية"); return; }
    s.full = full; put(STORE, data);
    results[key] = {date:data.date, id:s.id, town:String(parseInt(full.slice(0,3),10)), full, work, note, checks:chk, photos, at: old ? old.at : new Date().toISOString(), logged: old ? old.logged : false,
      stop:{phone:(s.phones && s.phones[0] && s.phones[0][0]) || "", lat:s.lat, lng:s.lng, task:s.task || ""},
      v:(old && old.v || 0) + 1, sent:false, tech: old && old.tech, sentPhotos:(old && old.sentPhotos) || []};
    put(RES, results); closeSheet(); view = "v"; render(); toast((isNew ? "انضافت الزيارة " : "انحفظت نتيجة ") + s.id); syncAll();
  };
  if (old) $("#undoRes").onclick = async e => {
    const b = e.currentTarget;
    if (s.manual && !b.dataset.sure){ b.dataset.sure = "1"; b.textContent = "متأكد؟ اضغط مرة ثانية للحذف"; return; }
    for (const k of (old.photos||[])) await IDB.del(k).catch(()=>{});
    queueDelete(old); delete results[key]; put(RES, results);
    if (s.manual){ data.stops = data.stops.filter(x => x !== s); put(STORE, data); }
    closeSheet(); render(); toast(s.manual ? "انحذفت الزيارة" : "انلغت"); syncAll(); };
}
function closeSheet(){ $("#sheetBg").hidden = true; }
$("#sheetBg").addEventListener("click", e => { if (e.target.id === "sheetBg") closeSheet(); });

// ---------- documentation view ----------
function renderDocs(){
  const main = $("#main"), showLogged = get(SHOWLOG, false);
  let all = Object.entries(results).map(([k,r]) => ({k, ...r}));
  const pend = all.filter(r => !r.logged).length, logged = all.length - pend;
  if (!showLogged) all = all.filter(r => !r.logged);
  all.sort((a,b) => (a.logged - b.logged) || String(a.at).localeCompare(String(b.at)));
  $("#sub").textContent = pend ? `${pend} زيارة بدها توثيق` : "كل الزيارات موثّقة";
  let lastDate = "";
  const items = all.map(r => {
    const h = r.date !== lastDate ? `<div class="dhead">${esc(r.date)}</div>` : ""; lastDate = r.date;
    const fn = resFull(r);
    return h + `<div class="doc${r.logged?" logged":""}">
      <div class="line"><span class="full num">${fn}</span><span class="sp" style="flex:1"></span>
        <button class="btn sm" data-editfull="${esc(r.k)}" type="button" aria-label="تعديل رقم الاشتراك">✏️</button>
        <button class="btn sm primary" data-copy="${fn}" type="button">نسخ الرقم</button></div>
      <div class="line"><span class="lbl">المهمة:</span><span class="work">${esc(r.work)}</span></div>
      <div class="line"><span class="note">${esc(r.note)}</span>
        <button class="btn sm" data-copy="${esc(r.note)}" type="button">نسخ الملاحظة</button></div>
      ${checksText(r.checks)?`<div class="line"><span class="checks" style="flex:1">${esc(checksText(r.checks))}</span>
        <button class="btn sm" data-copy="${esc(r.note + " · " + checksText(r.checks))}" type="button">نسخ الملاحظة + الفحص</button></div>`:""}
      ${(r.photos||[]).length?`<div class="photos">${r.photos.map((k,n)=>`<div class="thumb"><img alt="" data-pk="${esc(k)}">${n===0?`<span class="tag0">العداد</span>`:""}</div>`).join("")}</div>`:""}
      <div class="line"><span class="meta">${new Date(r.at).toLocaleTimeString("ar-JO",{hour:"2-digit",minute:"2-digit"})}</span>
        ${cfgReady() ? (r.sent ? `<span class="sync ok">☁️ عند المدير</span>` : `<span class="sync">⏳ لسا ما انبعت</span>`) : ""}<span style="flex:1"></span>
        <button class="btn sm${r.logged?"":" primary"}" data-logged="${esc(r.k)}" type="button">${r.logged?"موثّقة ✓":"وثّقتها ✓"}</button></div>
    </div>`;
  }).join("");
  main.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
    ${(() => { const un = Object.values(results).filter(r => !r.sent).length;
      return cfgReady() ? `<button class="btn${un?" primary":""}" id="sendBtn" type="button">☁️ ${un ? `إرسال ${un} للمدير` : "كل الزيارات عند المدير ✓"}</button>`
        : `<button class="btn" id="sendBtn" type="button">☁️ ربط مع المدير (Google Sheet)</button>`; })()}
    ${data?`<button class="btn" id="exportBtn2" type="button">⬇️ تصدير زيارات ${esc(data.date)} إلى Excel</button>`:""}
    <p class="sub" style="margin:0">لكل زيارة: انسخ الرقم ← الصق ← استعلام ← اختار نوع العمل ← انسخ الملاحظة ← الصق ← حفظ ← «وثّقتها»</p>
    ${logged?`<div class="bar"><label for="showLog"><input type="checkbox" id="showLog" ${showLogged?"checked":""}> عرض الموثّقة (${logged})</label>
      ${logged?`<button class="btn sm" id="clearLog" type="button">مسح الموثّقة</button>`:""}</div>`:""}
    ${items || `<div class="empty"><p>ما في زيارات بدها توثيق. لما تضغط «تم» على أي زيارة وتحفظ نتيجتها، بتظهر هون.</p></div>`}
  </div>`;
  fillThumbs(main).then(() => main.querySelectorAll(".doc img").forEach(im => im.onclick = () => viewPhoto(im.src)));
  const ex = $("#exportBtn2"); if (ex) ex.onclick = exportExcel;
  main.querySelectorAll("[data-editfull]").forEach(b => b.onclick = () => editFull(b.dataset.editfull));
  const sn = $("#sendBtn"); if (sn) sn.onclick = () => syncAll(true);
  const sl = $("#showLog"); if (sl) sl.onchange = e => { put(SHOWLOG, e.target.checked); render(); };
  const cl = $("#clearLog"); if (cl) cl.onclick = () => { Object.keys(results).forEach(k => { if (results[k].logged){ (results[k].photos||[]).forEach(pk => IDB.del(pk).catch(()=>{})); delete results[k]; } }); put(RES, results); render(); toast("انمسحت الموثّقة"); };
}
$("#tabV").onclick = () => { view = "v"; render(); scrollTo(0,0); };
$("#tabD").onclick = () => { view = "d"; render(); scrollTo(0,0); };

// ---------- Excel export ----------
function loadExcelJS(){
  if (window.ExcelJS) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "exceljs.min.js"; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
}
async function exportExcel(){
  if (!data) return toast("ما في زيارات محمّلة");
  toast("جاري تجهيز ملف Excel…");
  try { await loadExcelJS(); } catch(e){ return toast("لازم نت أول مرة عشان يتحمّل التصدير"); }
  const wb = new ExcelJS.Workbook(); wb.creator = "زياراتي";
  const ws = wb.addWorksheet("الزيارات", {views:[{rightToLeft:true, state:"frozen", ySplit:1}]});
  const cols = [
    ["#",5],["رقم الاشتراك (10 خانات)",16],["رقم المشترك",11],["الحالة",10],["وقت الإنجاز",11],["المهمة",14],
    ["الملاحظة",42],["ختم المودم",16],["ختم الكونيكشن",16],["ضعف شبكة",10],["الطلب",30],["التلفون",14],
    ["الإحداثيات",20],["الخريطة",11],["موثّقة بالنظام",12],["صورة العداد",22],["صورة 2",22],["صورة 3",22]
  ];
  ws.columns = cols.map(([h,w]) => ({header:h, width:w}));
  const hr = ws.getRow(1); hr.height = 24;
  hr.eachCell(c => { c.font = {bold:true, color:{argb:"FFFFFFFF"}}; c.fill = {type:"pattern", pattern:"solid", fgColor:{argb:"FF0B6E5E"}}; c.alignment = {vertical:"middle", horizontal:"center", wrapText:true}; });
  const seal = sealTxt;
  let rowN = 2, doneN = 0;
  for (const [i, s] of data.stops.entries()){
    const r = results[rkey(s.id)]; if (r) doneN++;
    const c = (r && r.checks) || {};
    const row = ws.getRow(rowN);
    row.values = [i+1, (r && r.full) || stopFull(s), s.id, r ? "تمت" : "لم تتم",
      r ? new Date(r.at).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : "", r ? r.work : "", r ? r.note : "",
      seal(c.modemSeal, c.modemOk), seal(c.connSeal, c.connOk), c.weak ? YN[c.weak] : "", s.task || "",
      (s.phones && s.phones[0] && s.phones[0][0]) || "", hasC(s) ? `${s.lat}, ${s.lng}` : "لا يوجد",
      hasC(s) ? {text:"فتح", hyperlink:`https://www.google.com/maps?q=${s.lat},${s.lng}`} : "", r ? (r.logged ? "نعم" : "لا") : ""];
    row.alignment = {vertical:"middle", wrapText:true};
    row.getCell(4).font = {bold:true, color:{argb: r ? "FF2E7D32" : "FFB3261E"}};
    if (hasC(s)) row.getCell(14).font = {color:{argb:"FF2B5DA8"}, underline:true};
    const pks = (r && r.photos || []).slice(0, 3);
    if (pks.length){
      row.height = 120;
      for (const [n, pk] of pks.entries()){
        const v = await IDB.get(pk).catch(()=>null); if (!v) continue;
        const buf = await v.blob.arrayBuffer();
        const id = wb.addImage({buffer:buf, extension:"jpeg"});
        const sc = Math.min(150 / v.w, 150 / v.h);
        ws.addImage(id, {tl:{col:15 + n + 0.05, row:rowN - 1 + 0.05}, ext:{width:Math.round(v.w*sc), height:Math.round(v.h*sc)}});
      }
    } else row.height = 36;
    rowN++;
  }
  const sum = ws.getRow(rowN + 1);
  sum.values = ["", `المجموع: ${data.stops.length} زيارة · تمت ${doneN} · لم تتم ${data.stops.length - doneN}`];
  sum.getCell(2).font = {bold:true};
  const buf = await wb.xlsx.writeBuffer();
  const name = `زيارات-${String(data.date).replace(/\//g,"-")}.xlsx`;
  const file = new File([buf], name, {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const sh = $("#sheet");
  sh.innerHTML = `<h3>ملف Excel جاهز ✅</h3><p class="sub" style="margin:0">${esc(name)} · ${data.stops.length} زيارة · ${(file.size/1024/1024).toFixed(1)} MB</p>
    <div class="row"><button type="button" class="btn primary" id="dlX">⬇️ تنزيل</button>
    ${navigator.canShare && navigator.canShare({files:[file]}) ? `<button type="button" class="btn" id="shX">📤 مشاركة</button>` : ""}</div>
    <button type="button" class="btn" id="closeSh">إغلاق</button>`;
  $("#sheetBg").hidden = false;
  $("#closeSh").onclick = closeSheet;
  $("#dlX").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast("انحفظ بالتنزيلات"); };
  const shx = $("#shX"); if (shx) shx.onclick = () => navigator.share({files:[file], title:name}).catch(()=>{});
}

function editFull(k){
  const r = results[k]; if (!r) return;
  const sh = $("#sheet");
  sh.innerHTML = `<h3>رقم الاشتراك · <span class="num">${esc(r.id)}</span></h3>
    <label class="lbl" for="efIn">رقم الاشتراك (10 خانات)</label>
    <input class="inp num" id="efIn" inputmode="numeric" maxlength="10" dir="ltr" value="${esc(resFull(r))}">
    <div class="row"><button type="button" class="btn primary" id="efSave">حفظ</button><button type="button" class="btn" id="closeSh">إلغاء</button></div>`;
  $("#sheetBg").hidden = false;
  $("#closeSh").onclick = closeSheet;
  $("#efSave").onclick = () => {
    const full = clean10($("#efIn").value);
    if (full.length !== 10) return toast("رقم الاشتراك لازم يكون 10 خانات");
    if (String(parseInt(full.slice(3), 10)) !== String(parseInt(r.id, 10))) return toast("آخر 7 خانات لازم تطابق رقم المشترك " + r.id);
    r.full = full; r.town = String(parseInt(full.slice(0,3),10)); r.sent = false; r.v = (r.v||0) + 1;
    if (data && data.date === r.date){ const s = data.stops.find(x => x.id === r.id); if (s){ s.full = full; put(STORE, data); } }
    put(RES, results); closeSheet(); render(); toast("انحفظ الرقم"); syncAll();
  };
}

let tt;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("on"), 1800); }

document.addEventListener("click", e => {
  const c = e.target.closest("[data-copy]");
  if (c){
    const v = c.dataset.copy;
    const fb = () => { const el = c.closest(".ph, .coords, .head, .line")?.querySelector(".num, .note"); if (el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("حدّد النص وانسخه"); };
    try { navigator.clipboard.writeText(v).then(()=>toast("تم النسخ: " + v), fb); } catch(err){ fb(); }
    return;
  }
  const d = e.target.closest("[data-done]");
  if (d){ openSheet(d.dataset.done); return; }
  const cp = e.target.closest("[data-logged]");
  if (cp){ const r = results[cp.dataset.logged]; if (r){ r.logged = !r.logged; put(RES, results); render(); toast(r.logged ? "تم التوثيق ✓" : "رجعت لغير موثّقة"); } }
});
$("#importBtn").onclick = () => $("#fileIn").click();
$("#fileIn").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { setData(JSON.parse(await f.text())); render(); toast("تم استيراد " + data.stops.length + " موقع"); }
  catch(err){ toast("الملف مش صحيح — تأكد إنه ملف الزيارات"); }
  e.target.value = "";
};
window.addEventListener("hashchange", async () => { if (await fromHash()) render(); });

(async () => { await fromHash(); render(); setTimeout(() => syncAll(), 1500); })();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
