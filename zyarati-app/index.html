/* «Midnight & Gold»: deep navy for structure, champagne gold for accents */
:root{
  color-scheme:light;
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#F8F6F2; --ink:#131A26; --muted:#6A6E78; --line:#E6E1D8; --line-2:#EFEBE4;
  --accent:#16263F; --accent-ink:#FFFFFF; --accent-soft:#EAEEF5;
  --gold:#C9A45C; --gold-deep:#8A6726; --gold-soft:#F7F0E1; --gold-line:#E6D3A9; --gold-ic:#E3C27E;
  --hdr-1:#1D3558; --hdr-2:#0A1526;
  --warn:#8A5A00; --warn-bg:#FFF6E3; --warn-line:#F0D496;
  --info:#2A5595; --info-bg:#EAF0FA;
  --done:#2B7A4F; --done-bg:#ECF5EF;
  --danger:#B42318; --danger-bg:#FDECEA;
  --shadow:0 1px 2px rgba(19,26,38,.04),0 8px 24px rgba(19,26,38,.07);
  --sans:"Plex",system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
  --mono:"Plex",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0A0F17; --surface:#121925; --surface-2:#172031; --ink:#E8ECF2; --muted:#98A2B3; --line:#243044; --line-2:#1B2434;
    --accent:#D8B46A; --accent-ink:#171204; --accent-soft:#272113;
    --gold:#D8B46A; --gold-deep:#E6C888; --gold-soft:#231E12; --gold-line:#4A3D20; --gold-ic:#171204;
    --hdr-1:#172A45; --hdr-2:#060B14;
    --warn:#F2C063; --warn-bg:#2A2112; --warn-line:#5A4418;
    --info:#93B6F2; --info-bg:#16223A;
    --done:#7CCB9C; --done-bg:#12261B;
    --danger:#F28B82; --danger-bg:#3A1714;
    --shadow:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;letter-spacing:.01em}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
/* app bar */
header{position:relative;display:flex;align-items:center;gap:11px;margin:calc(-14px - env(safe-area-inset-top,0px)) -16px 0;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 48px;color:#fff;border-radius:0 0 26px 26px;overflow:hidden;
  background:radial-gradient(120% 90% at 90% -30%,rgba(216,180,106,.22),transparent 55%),radial-gradient(80% 80% at 0% 120%,rgba(59,94,143,.35),transparent 60%),linear-gradient(150deg,var(--hdr-1),var(--hdr-2))}
header::after{content:"";position:absolute;inset-inline:22px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(216,180,106,.55),transparent)}
header .logo{flex:none;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(216,180,106,.4);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
header .logo svg{width:32px;height:32px}
header .t{flex:1;min-width:0}
h1{font-family:"Wordmark",var(--sans);font-size:25px;margin:0;font-weight:700;line-height:1.25;letter-spacing:0;background:linear-gradient(180deg,#FFFFFF 30%,#F2DFB4);-webkit-background-clip:text;background-clip:text;color:transparent}
header .sub{color:rgba(236,226,204,.78);margin:1px 0 0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .btn{background:rgba(255,255,255,.07);border-color:rgba(216,180,106,.42);color:#F3E3BF;box-shadow:none}
header .btn:active{background:rgba(255,255,255,.15)}
header .btn.icon-only{width:42px;padding:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
/* tabs float over the app bar and stay reachable while scrolling */
.tabs{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:6;margin-top:-46px;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);padding:5px;border-radius:16px;box-shadow:0 10px 28px rgba(10,21,38,.14)}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 13.5px/1.35 var(--sans);padding:10px 6px;border-radius:12px;cursor:pointer;transition:background .15s,color .15s}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -2px 0 var(--gold),0 3px 10px rgba(22,38,63,.25)}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 14px;font-size:13px;color:var(--muted);display:inline-flex;align-items:baseline;gap:6px}
.stat b{color:var(--gold-deep);font-size:18px;font-weight:700}
.progress{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#B98C3E,var(--gold),#EBD39B);border-radius:99px;transition:width .25s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--sans);padding:9px 14px;text-decoration:none;cursor:pointer;min-height:44px;transition:background .15s,border-color .15s,transform .08s}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--gold-soft);outline-offset:1px;border-color:var(--gold)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);background-image:linear-gradient(180deg,rgba(255,255,255,.07),transparent);box-shadow:0 2px 6px rgba(22,38,63,.18)}
.btn.primary .ic{color:var(--gold-ic)}
.btn.big{width:100%;font-size:15.5px;min-height:52px;border-radius:14px}
.btn.big .ic{width:20px;height:20px}
.btn.sm{min-height:38px;padding:6px 11px;font-size:13px;border-radius:10px;gap:5px}
.btn.sm .ic{width:16px;height:16px}
.routes{display:flex;flex-direction:column;gap:8px}
.alerts{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:16px;padding:14px 16px}
.alerts h2{font-size:14.5px;margin:0 0 8px;color:var(--warn);font-weight:700}
.alerts ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.alerts li{font-size:14px;display:flex;gap:8px;align-items:baseline}
.alerts li::before{content:"";flex:none;width:6px;height:6px;border-radius:99px;background:var(--warn);transform:translateY(-3px)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.bar input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
.bar .grp{display:flex;gap:6px;flex-wrap:wrap}
#list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.card.done{background:var(--done-bg);border-color:transparent;box-shadow:none}
.card.done .body{display:none}
.hide-done .card.done{display:none}
.head{display:flex;align-items:center;gap:10px}
.seq{flex:none;width:32px;height:32px;border-radius:10px;background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--gold-deep);display:grid;place-items:center;font:700 14px var(--sans)}
.card.done .seq{background:var(--done);border-color:var(--done);color:#fff}
.sid{font:700 21px var(--mono);letter-spacing:.02em}
.head .sp{flex:1}
.toggle{border-radius:99px;padding-inline:14px}
.card.done .toggle{background:var(--done);border-color:var(--done);color:#fff}
.body{display:flex;flex-direction:column;gap:12px}
.task{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600;border-inline-start:3px solid var(--gold)}
.task span{color:var(--gold-deep);font-weight:700;margin-inline-end:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:600;border-radius:8px;padding:3px 9px;background:var(--info-bg);color:var(--info)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.coords{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.coords .num{color:var(--ink);font-size:15px;font-weight:600}
.nocoord{background:var(--warn-bg);border:1px dashed var(--warn-line);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:4px}
.nocoord strong{color:var(--warn);font-size:14.5px}
.nocoord dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.nocoord dt{color:var(--muted)}
.nocoord dd{margin:0}
.addr{font-size:13px;color:var(--muted)}
.phones{display:flex;flex-direction:column;border-top:1px solid var(--line-2)}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.ph:last-child{border-bottom:0}
.ph .num{font-size:15.5px;font-weight:600;user-select:all;letter-spacing:0}
.ph .cnt{font-size:12px;color:var(--muted);font-weight:600}
.ph .tag{font-size:11.5px;color:var(--info);background:var(--info-bg);border-radius:6px;padding:1px 7px}
.ph.main .num{font-weight:700;font-size:16px}
.ph .acts{display:flex;gap:5px;margin-inline-start:auto}
.ph .acts .btn.sm{padding-inline:9px}
.btn.call{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wa{color:var(--done)}
.empty{background:var(--surface);border:1px dashed var(--gold-line);border-radius:18px;padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 0}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:#16263F;color:#fff;border:1px solid rgba(216,180,106,.35);padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 10px 28px rgba(10,21,38,.25);opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1;transform:none}
@media (prefers-color-scheme: dark){.toast{background:#E8ECF2;color:#0A0F17;border-color:transparent}}
.res{font-size:13px;color:var(--done);font-weight:600}
.res .ic{width:14px;height:14px;vertical-align:-2px}
.sheet-bg{position:fixed;inset:0;background:rgba(7,12,21,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{background:var(--surface);width:100%;max-width:620px;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto;box-shadow:0 -10px 34px rgba(0,0,0,.18);border-top:1px solid var(--gold-line)}
.sheet::before{content:"";flex:none;align-self:center;width:44px;height:4px;border-radius:99px;background:var(--gold-line);margin-bottom:4px}
.sheet h3{margin:0;font-size:18px;font-weight:700}
.lbl{font-size:13px;color:var(--muted);font-weight:600}
.lbl .ic{width:15px;height:15px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:600 14px var(--sans);border-radius:11px;padding:9px 14px;cursor:pointer;text-align:start;transition:background .15s,border-color .15s}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -2px 0 var(--gold)}
.tpls{display:flex;flex-direction:column;gap:6px}
.tpls .opt{width:100%;font-size:13.5px}
textarea{width:100%;min-height:78px;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:15px/1.6 var(--sans);background:var(--surface-2);color:var(--ink);resize:vertical}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.btn.danger{color:var(--danger)}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.doc.logged{opacity:.55;box-shadow:none}
.doc .full{font:700 21px var(--mono);letter-spacing:.03em}
.doc .line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.doc .work{background:var(--gold-soft);color:var(--gold-deep);border:1px solid var(--gold-line);border-radius:9px;padding:4px 11px;font-weight:700}
.doc .note{flex:1;min-width:200px;font-size:14px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:11px;padding:9px 11px}
.doc .meta{font-size:12px;color:var(--muted);font-weight:600}
.dhead{font-size:12.5px;color:var(--gold-deep);font-weight:700;margin-top:4px;letter-spacing:.02em}
.chk{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px}
.chk .q{font-size:14px;font-weight:600}
.chk .q.sub2{font-weight:400;color:var(--muted);padding-inline-start:14px}
.yn{display:flex;gap:6px}
.yn .opt{min-width:56px;text-align:center;padding:7px 10px;background:var(--surface)}
.yn .opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:none}
.yn .opt[aria-pressed="true"][data-v="no"]{background:var(--danger);border-color:var(--danger);color:#fff}
.yn .opt:disabled{opacity:.35}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:78px;height:78px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;inset-inline-end:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font:700 14px var(--sans);cursor:pointer}
.thumb .tag0{position:absolute;bottom:0;inset-inline:0;background:rgba(22,38,63,.9);color:#F3E3BF;font-size:10.5px;font-weight:600;text-align:center;padding:1px 0}
.checks{font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:7px 11px}
.checks .ic{width:15px;height:15px;color:var(--done)}
.townrow{display:flex;gap:8px}
.townrow .tb{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:12px;padding:9px 13px;cursor:pointer;font:600 12px var(--sans);text-align:start;transition:border-color .15s}
.townrow .tb b{font:700 16px var(--sans);color:var(--ink)}
.townrow .tb:active{border-color:var(--gold)}
.townrow .tb.num-b{flex:0 0 34%}
.townrow .tb.num-b b{font-family:var(--mono);letter-spacing:.04em}
.townrow .tb.empty b{color:var(--danger)}
.fullprev{font-size:13px;color:var(--muted)}
.fullprev:empty{display:none}
.inp.fullauto{background:var(--gold-soft);border-color:var(--gold-line);color:var(--ink);font-weight:700;font-size:17px;letter-spacing:.08em;pointer-events:none}
.fullprev .num{color:var(--ink);font-weight:700;font-size:15px}
.picker{position:fixed;inset:0;z-index:15;background:var(--surface);display:flex;flex-direction:column}
.picker .ph{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--gold-line);flex-wrap:nowrap}
.picker .ph h3{flex:1;margin:0;font-size:18px;font-weight:700}
.picker .ps{padding:12px 16px}
.picker .pl{flex:1;overflow:auto;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px))}
.picker .pi{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line-2);background:transparent;color:var(--ink);padding:13px 6px;font:500 16px var(--sans);cursor:pointer;text-align:start;border-radius:0}
.picker .pi .n{margin-inline-start:auto;font:600 15px var(--mono);color:var(--muted)}
.picker .pi.cur{background:var(--gold-soft);border-radius:10px}
.picker .pi.cur .n{color:var(--gold-deep)}
.picker .sec{font-size:12px;color:var(--gold-deep);font-weight:700;padding:12px 6px 4px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:20;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:15px var(--sans);background:var(--surface-2);color:var(--ink)}
.inp:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);background:var(--surface)}
.inp.num{font-size:16px;font-weight:600;letter-spacing:.04em}
select.inp{appearance:auto}
.sync{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--warn-bg);color:var(--warn)}
.sync .ic{width:13px;height:13px}
.sync.ok{background:var(--done-bg);color:var(--done)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.postbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:14px;padding:10px 12px}
.postbar .pb-link{flex:1;min-width:130px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:transparent;padding:0;cursor:pointer;font:600 13.5px var(--sans);color:var(--gold-deep);text-align:start}
.more{font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:3px;opacity:.85}
.pl-sec{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pl-sec .pl-h{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-weight:700;font-size:14px}
.pl-sec.wait .pl-h{background:var(--gold-soft);color:var(--gold-deep)}
.pl-sec.sent .pl-h{background:var(--done-bg);color:var(--done)}
.pl-sec .hint{padding:10px 12px}
.pl-row{display:flex;flex-direction:column;gap:1px;padding:9px 12px;border-top:1px solid var(--line-2)}
.pl-row .num{font-weight:700;font-size:15px;letter-spacing:.04em}
.pl-row .pl-meta{font-size:12.5px;color:var(--muted)}
.pl-row.del .num{text-decoration:line-through;color:var(--danger)}
.postbar .btn{flex:none}
.posted{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap;width:100%;border:0;cursor:pointer;background:var(--done-bg);color:var(--done);border-radius:12px;padding:11px;font:600 14px var(--sans)}
.fullrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.fullrow .num{font-size:15px;font-weight:600}
.fullrow .tag{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 7px}
.selbox{width:24px;height:24px;flex:none;accent-color:var(--accent);pointer-events:none;margin:4px}
.selecting .card .body{display:none}
.card.selected{outline:2px solid var(--gold);outline-offset:-1px}
.selbar{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--gold-line);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.btn:disabled{opacity:.45;cursor:not-allowed}
details summary{list-style:revert}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="logo"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lgGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3D896"/><stop offset=".5" stop-color="#D6AE5E"/><stop offset="1" stop-color="#A97C2F"/></linearGradient></defs><path d="M161.2,282.3 A118,118 0 1 1 350.8,282.3 L261.7,402.3 Q256,415 250.3,402.3 Z" fill="url(#lgGold)"/><circle cx="256" cy="212" r="84" fill="#12233B"/><g transform="translate(256 213) scale(.82) translate(-256 -214)"><path d="M272 138 L206 232 L250 232 L236 290 L306 190 L262 190 Z" fill="url(#lgGold)" stroke="url(#lgGold)" stroke-width="7" stroke-linejoin="round"/></g></svg></div>

    <button class="btn" id="importBtn" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d='M12 15V3' /><path d='M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' /><path d='m7 10 5 5 5-5' /></svg> استيراد</button>
    <input type="file" id="fileIn" accept=".zip,application/zip,application/x-zip-compressed,.json,application/json" hidden>
    <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
    <input type="file" id="galIn" accept="image/*" multiple hidden>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabV" aria-selected="true">خط السير</button>
    <button type="button" role="tab" id="tabM" aria-selected="false">الزيارات المُدخلة</button>
    <button type="button" role="tab" id="tabD" aria-selected="false">التوثيق</button>
  </div>
  <div id="main"></div>
  <p class="foot">الإحداثيات: القيمة الأكثر تكراراً، وعند التساوي الأقدم · أرقام الهواتف مرتبة من الأكثر تكراراً</p>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt="صورة الزيارة"></div>
<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
const STORE = "visits.data.v1", RES = "visits.results.v1", HIDE = "visits.hide.v1", SHOWLOG = "visits.showlogged.v1";
const WORKS = ["معالجة اتصال","تركيب مودم","جلب قراءة","توزيع فواتير"];
const NOTES = ["تم برمجة العداد مرتبط بالزمن ومعالجة الاتصال","تم برمجة العداد مرتبط بالزمن ويوجد ضعف شبكة","تم برمجة العداد مرتبط بالزمن , تم اجراء اللازم ولم يتصل","تم برمجة العداد مرتبط بالزمن و وجد العداد متصل","وجد العداد مبدل ومتصل , تم برمجة العداد مرتبط بالزمن عن بعد","وجد العداد مبدل ومتصل , تم برمجة العداد مرتبط بالزمن"];
const ICONS = {"gear":"<path d='M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915' /><circle cx='12' cy='12' r='3' />","import":"<path d='M12 15V3' /><path d='M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' /><path d='m7 10 5 5 5-5' />","trash":"<path d='M10 11v6' /><path d='M14 11v6' /><path d='M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6' /><path d='M3 6h18' /><path d='M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2' />","cloud":"<path d='M12 13v8' /><path d='M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242' /><path d='m8 17 4-4 4 4' />","plus":"<path d='M5 12h14' /><path d='M12 5v14' />","excel":"<path d='M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z' /><path d='M14 2v5a1 1 0 0 0 1 1h5' /><path d='M8 13h2' /><path d='M14 13h2' /><path d='M8 17h2' /><path d='M14 17h2' />","edit":"<path d='M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z' /><path d='m15 5 4 4' />","camera":"<path d='M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z' /><circle cx='12' cy='13' r='3' />","image":"<rect width='18' height='18' x='3' y='3' rx='2' ry='2' /><circle cx='9' cy='9' r='2' /><path d='m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21' />","share":"<circle cx='18' cy='5' r='3' /><circle cx='6' cy='12' r='3' /><circle cx='18' cy='19' r='3' /><line x1='8.59' x2='15.42' y1='13.51' y2='17.49' /><line x1='15.41' x2='8.59' y1='6.51' y2='10.49' />","select":"<path d='M21 10.656V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.344' /><path d='m9 11 3 3L22 4' />","phone":"<path d='M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384' />","wa":"<path d='M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719' />","copy":"<rect width='14' height='14' x='8' y='8' rx='2' ry='2' /><path d='M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2' />","check":"<path d='M20 6 9 17l-5-5' />","nav":"<polygon points='3 11 22 2 13 21 11 13 3 11' />","map":"<path d='M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z' /><path d='M15 5.764v15' /><path d='M9 3.236v15' />","users":"<path d='M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2' /><path d='M16 3.128a4 4 0 0 1 0 7.744' /><path d='M22 21v-2a4 4 0 0 0-3-3.87' /><circle cx='9' cy='7' r='4' />","install":"<rect width='14' height='20' x='5' y='2' rx='2' ry='2' /><path d='M12 18h.01' />","link":"<path d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71' /><path d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71' />","alert":"<path d='m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3' /><path d='M12 9v4' /><path d='M12 17h.01' />","download":"<path d='M12 15V3' /><path d='M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' /><path d='m7 10 5 5 5-5' />","pin":"<path d='M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0' /><circle cx='12' cy='10' r='3' />"};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

let data = get(STORE, null);
// ---------- photo storage (IndexedDB) ----------
const IDB = (() => {
  let dbp;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("visits-photos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("p");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => db().then(d => new Promise((res, rej) => {
    const t = d.transaction("p", mode), req = fn(t.objectStore("p"));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
  }));
  return { put: (k, v) => run("readwrite", s => s.put(v, k)), get: k => run("readonly", s => s.get(k)), del: k => run("readwrite", s => s.delete(k)) };
})();
async function compress(file, max = 1280, q = 0.72){
  let bmp; try { bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); } catch(e) { bmp = await createImageBitmap(file); }
  const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", q));
  return {blob, w:c.width, h:c.height};
}
const urlCache = {};
async function photoUrl(k){ if (urlCache[k]) return urlCache[k]; const v = await IDB.get(k).catch(()=>null); return v ? (urlCache[k] = URL.createObjectURL(v.blob)) : ""; }
async function fillThumbs(root){ for (const img of root.querySelectorAll("img[data-pk]")) img.src = await photoUrl(img.dataset.pk); }
function viewPhoto(src){ $("#viewerImg").src = src; $("#viewer").hidden = false; }
$("#viewer").onclick = () => { $("#viewer").hidden = true; };
const YN = {yes:"نعم", no:"لا"};
function checksText(c){
  if (!c) return "";
  const seal = (name, has, ok) => has === "no" ? `${name}: غير موجود` : has === "yes" ? `${name}: موجود${ok==="yes"?" وسليم":ok==="no"?" وغير سليم":""}` : "";
  return [seal("ختم المودم", c.modemSeal, c.modemOk), seal("ختم الكونيكشن", c.connSeal, c.connOk), c.weak ? `ضعف شبكة: ${YN[c.weak]}` : ""].filter(Boolean).join(" · ");
}

// ---------- settings + sync to Google Sheet ----------
const CFG = "visits.cfg.v1", DELQ = "visits.delq.v1";
let cfg = Object.assign({name:"", url:"", token:"", auto:false, team:[]}, get(CFG, {}));
const cfgReady = () => !!(cfg.url && cfg.token && cfg.name);
const sealTxt = (has, ok) => has === "no" ? "غير موجود" : has === "yes" ? (ok === "yes" ? "موجود وسليم" : ok === "no" ? "موجود وغير سليم" : "موجود") : "";
const b64url = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64url = s => decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/"))));
const blobToB64 = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(b); });
async function postScript(body){
  const res = await fetch(cfg.url, {method:"POST", body: JSON.stringify(body)});
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "فشل");
  return j;
}
async function payloadFor(r){
  const c = r.checks || {}, st = r.stop || {}, sent = r.sentPhotos || [], photos = [];
  for (const pk of (r.photos || [])){
    const item = {k: pk};
    if (!sent.includes(pk)){ const v = await IDB.get(pk).catch(()=>null); if (v) item.b64 = await blobToB64(v.blob); }
    photos.push(item);
  }
  const hasLoc = st.lat != null && st.lng != null;
  return {token:cfg.token, tech:r.tech || cfg.name, date:r.date, id:r.id, full:resFull(r), work:r.work, note:r.note,
    modem:sealTxt(c.modemSeal, c.modemOk), conn:sealTxt(c.connSeal, c.connOk), weak:c.weak ? YN[c.weak] : "",
    task:st.task || "", phone:st.phone || "", coords: hasLoc ? `${st.lat}, ${st.lng}` : "لا يوجد",
    map: hasLoc ? `https://www.google.com/maps?q=${st.lat},${st.lng}` : "", photos};
}
// what is waiting to be posted: unsent visits + deletions of visits that were already posted
function pendingPost(){
  const un = Object.values(results).filter(r => !r.sent), dq = get(DELQ, []);
  const days = new Set(un.map(r => r.date).concat(dq.map(d => d.date)));
  return {n: un.length, del: dq.length, onlyToday: [...days].every(d => d === todayStr())};
}
function postBtnHtml(id, big){
  if (!cfgReady()) return "";
  const p = pendingPost(), tot = p.n + p.del;
  if (!tot) return big ? `<button type="button" class="posted" data-postlist>${ic("check")} تم ترحيل جميع الزيارات إلى رئيس القسم<span class="more">عرض ›</span></button>` : "";
  const label = p.onlyToday ? "ترحيل زيارات اليوم" : "ترحيل الزيارات";
  const cnt = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : `${n} ${n <= 10 ? few : many}`;
  const what = [p.n ? cnt(p.n, "زيارة واحدة", "زيارتان", "زيارات", "زيارة") + " لم تُرحّل بعد" : "",
    p.del ? cnt(p.del, "حذف واحد", "حذفان", "عمليات حذف", "عملية حذف") + " بانتظار الترحيل" : ""].filter(Boolean).join(" · ");
  return `<div class="postbar"><button type="button" class="pb-link" data-postlist>${what}<span class="more">عرض الزيارات ›</span></button><button class="btn primary" id="${id}" type="button">${ic("cloud")} ${label}</button></div>`;
}
// list of saved visits split into «لم تُرحّل بعد» and «مُرحّلة»
function openPostList(){
  const all = Object.values(results).sort((a, b) => (a.date === b.date ? 0 : dmy(b.date) - dmy(a.date)) || String(a.at).localeCompare(String(b.at)));
  const un = all.filter(r => !r.sent), done = all.filter(r => r.sent), dq = get(DELQ, []), today = todayStr();
  const row = (r, ok) => { const f = resFull(r), tn = townName(parseInt(f.slice(0, 3), 10));
    return `<div class="pl-row${ok ? " ok" : ""}"><span class="num">${esc(f)}</span><span class="pl-meta">${esc([tn, r.work].filter(Boolean).join(" · "))}${r.date !== today ? ` · <span class="num">${esc(r.date)}</span>` : ""}</span></div>`; };
  const sec = (title, n, body, cls) => `<div class="pl-sec ${cls}"><div class="pl-h">${title} <b class="num">${n}</b></div>${body || `<p class="hint">لا يوجد</p>`}</div>`;
  const sh = $("#sheet"), p = pendingPost();
  sh.innerHTML = `<h3>الزيارات والترحيل</h3>
    ${sec("لم تُرحّل بعد", un.length + dq.length, un.map(r => row(r, false)).join("") + dq.map(d => `<div class="pl-row del"><span class="num">${esc(d.full || d.id)}</span><span class="pl-meta">حذف بانتظار الترحيل${d.date !== today ? ` · <span class="num">${esc(d.date)}</span>` : ""}</span></div>`).join(""), "wait")}
    ${sec("مُرحّلة إلى رئيس القسم", done.length, done.map(r => row(r, true)).join(""), "sent")}
    <div class="row">${p.n + p.del && cfgReady() ? `<button type="button" class="btn primary" id="postBtnL">${ic("cloud")} ${p.onlyToday ? "ترحيل زيارات اليوم" : "ترحيل الزيارات"}</button>` : ""}<button type="button" class="btn" id="closeSh">إغلاق</button></div>`;

function dist(a, b){
  const R = 6371000, t = Math.PI/180;
  const dLat = (b.lat-a.lat)*t, dLng = (b.lng-a.lng)*t;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// ---------- ordering from current location ----------
function orderFrom(start){
  const withC = data.stops.filter(hasC), noC = data.stops.filter(s => !hasC(s));
  const out = []; let cur = start; const left = withC.slice();
  while (left.length){
    let bi = 0, bd = Infinity;
    left.forEach((s,i) => { const d = dist(cur, s); if (d < bd) { bd = d; bi = i; } });
    cur = left.splice(bi,1)[0]; out.push(cur);
  }
  // put stops without coordinates right after a stop sharing a phone, else at the end
  noC.forEach(s => {
    const ph = new Set(s.phones.map(p=>p[0]));
    let at = -1; out.forEach((o,i) => { if (o.phones.some(p=>ph.has(p[0]))) at = i; });
    if (at >= 0) out.splice(at+1, 0, s); else out.push(s);
  });
  data.stops = out; put(STORE, data); render();
}
function sortByLocation(){
  if (!navigator.geolocation) return toast("الموقع غير متاح على هذا الجهاز");
  toast("جاري تحديد موقعك…");
  navigator.geolocation.getCurrentPosition(
    p => { orderFrom({lat:p.coords.latitude, lng:p.coords.longitude}); toast("تم ترتيب المسار انطلاقاً من موقعك"); },
    () => toast("تعذّر تحديد موقعك — فعّل خدمة الموقع (GPS)"),
    {enableHighAccuracy:true, timeout:15000}
  );
}

function alerts(){

  }

  S.forEach(s => s.phones.forEach(([p]) => (phones[p] ||= new Set()).add(s.id)));

function routeLinks(){

// full-screen town picker: mode "name" (Arabic keyboard) or "num" (number pad)
function pickTown(mode, cur, onPick){
  const el = document.createElement("div"); el.className = "picker"; el.setAttribute("role", "dialog");
  el.innerHTML = `<div class="ph"><h3>${mode === "num" ? "رقم البلدة" : "اسم البلدة"}</h3><button type="button" class="btn sm" data-x>إغلاق</button></div>
    <div class="ps"><input class="inp ${mode === "num" ? "num" : ""}" ${mode === "num" ? 'inputmode="numeric" dir="ltr"' : ""} placeholder="${mode === "num" ? "اكتب رقم البلدة، مثل 4" : "اكتب جزءاً من اسم البلدة"}" autocomplete="off"></div>
    <div class="pl"></div>`;
  document.body.appendChild(el);
  const inp = el.querySelector("input"), list = el.querySelector(".pl");
  const row = ([n, name]) => `<button type="button" class="pi${+cur === n ? " cur" : ""}" data-n="${n}"><span>${esc(name)}</span><span class="n">${pad3(n)}</span></button>`;
  const draw = () => {
    const q = inp.value.trim();
    let items, head = "";
    if (!q){
      const rec = recentTowns();
      head = rec.length ? `<div class="sec">المستخدمة مؤخراً</div>${rec.map(n => row([n, townName(n)])).join("")}<div class="sec">كل البلدات</div>` : "";
      items = TOWN_LIST;
    } else if (/^\d+$/.test(AR_DIG(q))){
      const d = String(+AR_DIG(q));
      items = TOWN_LIST.filter(([n]) => String(n).startsWith(d)).sort((a, b) => (String(a[0]) === d ? -1 : 0) - (String(b[0]) === d ? -1 : 0) || a[0] - b[0]);
    } else {
      const k = normAr(q), k2 = k.replace(/ /g, "");
      items = TOWN_KEY.filter(t => t[2].includes(k) || t[3].includes(k2)).sort((a, b) => (b[2].startsWith(k) - a[2].startsWith(k)) || a[0] - b[0]);
    }
    list.innerHTML = head + (items.map(row).join("") || `<div class="sec">لا توجد بلدة بهذا ${mode === "num" ? "الرقم" : "الاسم"}</div>`);
  };
  const close = () => el.remove();
  el.querySelector("[data-x]").onclick = close;
  list.onclick = e => { const b = e.target.closest("[data-n]"); if (!b) return; rememberTown(+b.dataset.n); onPick(+b.dataset.n); close(); };
  inp.oninput = draw;
  inp.onkeydown = e => { if (e.key === "Enter"){ const b = list.querySelector("[data-n]"); if (b) b.click(); } };
  draw(); setTimeout(() => inp.focus(), 60);
}

function loadScript(src){ return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) return res(); const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
let readerReady = null;
function loadReader(){
  return readerReady || (readerReady = (async () => {
    await loadScript("wa-import.js"); await loadScript("reader.js");
    const m = await (await fetch("reader-model.json")).json(); VisitReader.setNet(m);
  })().catch(e => { readerReady = null; throw e; }));

const TOWNS = {"اربد":"1","إربد":"1","جرش":"4"};
function nearestOrder(stops){
  const withC = stops.filter(hasC), noC = stops.filter(s => !hasC(s));
  if (!withC.length) return stops;
  let cur = withC.reduce((a, b) => (b.lat > a.lat ? b : a)); const out = [cur]; const left = withC.filter(s => s !== cur);
  while (left.length){ let bi = 0, bd = Infinity; left.forEach((s, i) => { const d = dist(cur, s); if (d < bd){ bd = d; bi = i; } }); cur = left.splice(bi, 1)[0]; out.push(cur); }
  noC.forEach(s => { const ph = new Set(s.phones.map(p => p[0])); let at = -1; out.forEach((o, i) => { if (o.phones.some(p => ph.has(p[0]))) at = i; }); if (at >= 0) out.splice(at + 1, 0, s); else out.push(s); });
  return out;
}

            reads.push(VisitReader.readGray(g, W, H));
            const c = await compress(blob, 1600, 0.8);
            const k = "ref|" + day.date + "|" + sub.id + "|" + refs.length; await IDB.put(k, {blob: c.blob, w: c.w, h: c.h}); refs.push(k);
          } catch(e){ console.warn(e); }
        }
        doneN++; $("#impProg i").style.width = (doneN / total * 100) + "%";
      }
      const r = VisitReader.combine(reads);
      const phones = r.phones.map(o => o.alt.length ? [o.p, o.n, "تحقق من الصورة: قد يكون " + o.alt[0]] : [o.p, o.n]);
      sub.extraPhones.forEach(p => { if (!phones.some(x => x[0] === p)) phones.push([p, 1, "من الطلب"]); });
      const warn = [];
      if (r.lat === null || r.lng === null) warn.push("لم تُقرأ الإحداثيات آلياً — راجع الصور الأصلية");
      if (!phones.length) warn.push("لم تُقرأ أرقام الهواتف آلياً — راجع الصور الأصلية");
      stops.push({id: sub.id, lat: r.lat, lng: r.lng, phones, task: sub.task, refs, warn, auto: true});
    }
    setData({date: day.date, area: "", town: "1", stops: nearestOrder(stops), auto: true});
    closeSheet(); view = "v"; render(); scrollTo(0, 0);
    const bad = stops.filter(s => s.warn.length).length;
    toast(`تمت قراءة ${stops.length} مشتركاً` + (bad ? ` — ${bad} بحاجة إلى مراجعة` : ""));
  };
  const draw = () => {
    const n = day.subs.length, imgs = day.subs.reduce((a, s) => a + s.images.length, 0);
    sh.innerHTML = `<h3>استيراد محادثة واتساب</h3>
      <label class="lbl" for="impDate">التاريخ</label>
      <select class="inp" id="impDate">${dates.slice().reverse().map(d => `<option ${d === day.date ? "selected" : ""}>${esc(d)}</option>`).join("")}</select>
      <div class="checks">${n ? `وُجد <b>${n}</b> مشتركاً و<b>${imgs}</b> صورة من «${esc(day.clerk || "")}».` : "لا توجد أرقام اشتراكات مع صور في هذا التاريخ."}</div>
      <p class="hint">تُقرأ الإحداثيات وأرقام الهواتف من الصور على هاتفك مباشرة، دون إنترنت ودون إرسال أي بيانات. القراءة الآلية قد تخطئ، لذا تُحفظ الصور الأصلية مع كل موقع للمراجعة.</p>
      <div class="progress" id="impProg" hidden><i style="width:0%"></i></div>
      <p class="hint" id="impMsg"></p>
      <div class="row"><button type="button" class="btn primary" id="impGo" ${n ? "" : "disabled"}>قراءة الصور وبناء خط السير</button><button type="button" class="btn" id="closeSh">إلغاء</button></div>`;
    $("#closeSh").onclick = closeSheet;
    $("#impDate").onchange = e => { day = WAImport.buildDay(msgs, e.target.value); draw(); };
    $("#impGo").onclick = run;
  };
  draw();
}

// ---------- Excel export ----------
function loadExcelJS(){
  if (window.ExcelJS) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "exceljs.min.js"; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
}
async function exportExcel(){
  if (!data) return toast("لا توجد زيارات محمّلة");
  toast("جاري تجهيز ملف Excel…");
  try { await loadExcelJS(); } catch(e){ return toast("يلزم الاتصال بالإنترنت في المرة الأولى لتحميل أداة التصدير"); }
  const wb = new ExcelJS.Workbook(); wb.creator = "زياراتي";
  const ws = wb.addWorksheet("الزيارات", {views:[{rightToLeft:true, state:"frozen", ySplit:1}]});
  const cols = [
    ["#",5],["رقم الاشتراك (10 خانات)",16],["رقم المشترك",11],["الحالة",10],["المهمة",14],
    ["الملاحظة",42],["ختم المودم",16],["ختم الكونيكشن",16],["ضعف شبكة",10],["الطلب",30],["التلفون",14],
    ["الإحداثيات",20],["الخريطة",11],["موثّقة بالنظام",12],["صورة العداد",22],["صورة 2",22],["صورة 3",22]
  ];
  ws.columns = cols.map(([h,w]) => ({header:h, width:w}));
  const hr = ws.getRow(1); hr.height = 24;
  hr.eachCell(c => { c.font = {bold:true, color:{argb:"FFFFFFFF"}}; c.fill = {type:"pattern", pattern:"solid", fgColor:{argb:"FF0B6E5E"}}; c.alignment = {vertical:"middle", horizontal:"center", wrapText:true}; });
  const seal = sealTxt;
  let rowN = 2, doneN = 0;
  for (const [i, s] of data.stops.entries()){
    const r = results[rkey(s.id)]; if (r) doneN++;
    const c = (r && r.checks) || {};
    const row = ws.getRow(rowN);
    row.values = [i+1, (r && r.full) || stopFull(s), s.id, r ? "تمت" : "لم تتم",
      r ? r.work : "", r ? r.note : "",
      seal(c.modemSeal, c.modemOk), seal(c.connSeal, c.connOk), c.weak ? YN[c.weak] : "", s.task || "",
      (s.phones && s.phones[0] && s.phones[0][0]) || "", hasC(s) ? `${s.lat}, ${s.lng}` : "لا يوجد",
      hasC(s) ? {text:"فتح", hyperlink:`https://www.google.com/maps?q=${s.lat},${s.lng}`} : "", r ? (r.logged ? "نعم" : "لا") : ""];
    row.alignment = {vertical:"middle", wrapText:true};
    row.getCell(4).font = {bold:true, color:{argb: r ? "FF2E7D32" : "FFB3261E"}};
    if (hasC(s)) row.getCell(13).font = {color:{argb:"FF2B5DA8"}, underline:true};
    const pks = (r && r.photos || []).slice(0, 3);
    if (pks.length){
      row.height = 120;
      for (const [n, pk] of pks.entries()){
        const v = await IDB.get(pk).catch(()=>null); if (!v) continue;
        const buf = await v.blob.arrayBuffer();
        const id = wb.addImage({buffer:buf, extension:"jpeg"});
        const sc = Math.min(150 / v.w, 150 / v.h);
        ws.addImage(id, {tl:{col:14 + n + 0.05, row:rowN - 1 + 0.05}, ext:{width:Math.round(v.w*sc), height:Math.round(v.h*sc)}});
      }
    } else row.height = 36;
    rowN++;
  }
  const sum = ws.getRow(rowN + 1);
  sum.values = ["", `المجموع: ${data.stops.length} زيارة · تمت ${doneN} · لم تتم ${data.stops.length - doneN}`];
  sum.getCell(2).font = {bold:true};
  const buf = await wb.xlsx.writeBuffer();
  const name = `زيارات-${String(data.date).replace(/\//g,"-")}.xlsx`;
  const file = new File([buf], name, {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const sh = $("#sheet");
  sh.innerHTML = `<h3>ملف Excel جاهز</h3><p class="sub" style="margin:0">${esc(name)} · ${data.stops.length} زيارة · ${(file.size/1024/1024).toFixed(1)} MB</p>
    <div class="row"><button type="button" class="btn primary" id="dlX">${ic("download")} تنزيل</button>
    ${navigator.canShare && navigator.canShare({files:[file]}) ? `<button type="button" class="btn" id="shX">${ic("share")} مشاركة</button>` : ""}</div>
    <button type="button" class="btn" id="closeSh">إغلاق</button>`;
  $("#sheetBg").hidden = false;
  $("#closeSh").onclick = closeSheet;
  $("#dlX").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast("تم الحفظ في التنزيلات"); };
  const shx = $("#shX"); if (shx) shx.onclick = () => navigator.share({files:[file], title:name}).catch(()=>{});
}

function editFull(k){
  const r = results[k]; if (!r) return;
  const sh = $("#sheet"), f0 = clean10(resFull(r));
  let town = parseInt(f0.slice(0, 3), 10); if (!TOWN_BY.has(town)) town = 0;
  sh.innerHTML = `<h3>رقم الاشتراك · <span class="num">${esc(r.id)}</span></h3>
    <div class="lbl">البلدة *</div>
    <div class="townrow" id="townBox"></div>
    <div class="fullprev" id="fullPrev"></div>
    <div class="row"><button type="button" class="btn primary" id="efSave">حفظ</button><button type="button" class="btn" id="closeSh">إلغاء</button></div>`;
  $("#sheetBg").hidden = false;
  const drawFull = () => { $("#fullPrev").innerHTML = town ? `رقم الاشتراك (10 خانات): <span class="num">${fullNum(town, r.id)}</span>` : "اختر البلدة"; };
  townButtons($("#townBox"), () => town, v => { town = v; drawFull(); }); drawFull();
  $("#closeSh").onclick = closeSheet;
  $("#efSave").onclick = () => {
    if (!town) return toast("اختر البلدة");
    const full = fullNum(town, r.id); rememberTown(town);
    r.full = full; r.town = String(town); r.sent = false; r.v = (r.v||0) + 1;
    if (data && data.date === r.date){ const s = data.stops.find(x => x.id === r.id); if (s){ s.full = full; put(STORE, data); } }
    put(RES, results); closeSheet(); render(); toast("تم حفظ الرقم"); syncAll();
  };
}

let tt;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("on"), 1800); }

document.addEventListener("click", e => {
  if (e.target.closest("[data-postlist]")){ openPostList(); return; }
  if (selMode){
    const card = e.target.closest("[data-card]");
    if (card && !e.target.closest("button, a")){ const id = card.dataset.card; sel.has(id) ? sel.delete(id) : sel.add(id); render(); return; }
  }
  const c = e.target.closest("[data-copy]");
  if (c){
    const v = c.dataset.copy;
    const fb = () => { const el = c.closest(".ph, .coords, .head, .line")?.querySelector(".num, .note"); if (el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("حدّد النص وانسخه يدوياً"); };
    try { navigator.clipboard.writeText(v).then(()=>toast("تم النسخ: " + v), fb); } catch(err){ fb(); }
    return;
  }
  const d = e.target.closest("[data-done]");
  if (d){ openSheet(d.dataset.done); return; }
  const cp = e.target.closest("[data-logged]");
  if (cp){ const r = results[cp.dataset.logged]; if (r){ r.logged = !r.logged; put(RES, results); render(); toast(r.logged ? "تم التوثيق ✓" : "أُعيدت إلى غير موثّقة"); } }
});
$("#importBtn").onclick = () => $("#fileIn").click();
$("#fileIn").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  e.target.value = "";
  if (/\.zip$/i.test(f.name) || /zip/.test(f.type)) return importWhatsApp(f);
  try { setData(JSON.parse(await f.text())); render(); toast("تم استيراد " + data.stops.length + " موقع"); }
  catch(err){ toast("الملف غير صحيح — اختر ملف محادثة واتساب (zip) أو ملف الزيارات"); }
};
window.addEventListener("hashchange", async () => { if (await fromHash()) render(); });

async function takeShared(){
  if (!/[?&]share=1/.test(location.search)) return;
  history.replaceState(null, "", location.pathname + location.hash);
  try {
    const c = await caches.open("share-inbox"), r = await c.match("shared"); if (!r) return toast("لم يصل الملف — جرّب المشاركة مرة أخرى");
    const name = decodeURIComponent(r.headers.get("x-name") || "chat.zip"), f = new File([await r.blob()], name, {type: r.headers.get("content-type") || "application/zip"});
    await c.delete("shared");
    if (/\.zip$/i.test(name) || /zip/.test(f.type)) importWhatsApp(f);
    else toast("الملف المُشارك ليس ملف محادثة — اختر «تصدير الدردشة» مع الوسائط");
  } catch(e){ toast("تعذّر استلام الملف المُشارك"); }
}
(async () => { await fromHash(); render(); await takeShared(); setTimeout(() => syncAll(), 1500); })();
const APP_VERSION = 25;
if ("serviceWorker" in navigator){
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded){ reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(r => r.update()).catch(()=>{});
}
